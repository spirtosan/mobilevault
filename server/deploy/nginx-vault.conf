# /etc/nginx/sites-available/vault.<DOMAIN>  → symlink into sites-enabled
# Separate subdomain so client-certificate requests never affect the other sites.

server {
    listen 80;
    listen [::]:80;
    server_name vault.<DOMAIN>;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # no "http2" here: on nginx 1.24 it is a per-socket option and would switch the other sites on :443 too
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vault.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/vault.<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # mTLS: phones present a certificate signed by the private Mobile Vault CA.
    # "optional" only so that /api/v1/pair (first contact) and /health work without one.
    ssl_client_certificate /etc/mvault/ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;

    client_max_body_size 5m;
    limit_req_status 429;
    client_body_timeout 30s;
    server_tokens off;
    autoindex off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/mvault.access.log;
    error_log  /var/log/nginx/mvault.error.log warn;

    # Headers the backend trusts. Always overwritten here; never taken from the client.
    proxy_set_header X-Client-Verify $ssl_client_verify;
    proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
    proxy_set_header Host            $host;
    proxy_http_version 1.1;
    proxy_request_buffering on;

    location = /api/v1/health {
        limit_req zone=mvault burst=10 nodelay;
        proxy_pass http://127.0.0.1:8790;
    }

    location = /api/v1/pair {
        limit_req zone=mvault_pair burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
    }

    location /api/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=mvault burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
    }

    location / { return 404; }
}
